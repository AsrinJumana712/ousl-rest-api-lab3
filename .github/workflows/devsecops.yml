name: AWS DevSecOps Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ousl-project

    steps:
      # Step 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # Step 3: SonarCloud SAST Scan
      - name: SonarCloud SAST Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn verify sonar:sonar -Dsonar.projectKey=ousl-student-service || true

      # Step 4: Build Docker Container
      - name: Build Container
        run: docker build -t ousl-student-api-lab3:${{ github.sha }} .

      # Step 5: Scan Docker Image using Aqua Security Trivy
      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "ousl-student-api-lab3:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL"

      # Step 6: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Container Image to working-directory
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag ousl-student-api:${{ github.sha }} $ECR_REGISTRY/ousl-student-api:${{ github.sha}}
